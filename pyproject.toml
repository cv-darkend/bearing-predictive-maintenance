[project]
name = "bearing-predictive-maintenance"
version = "0.1.0"
description = "Reproducible research scaffold for bearing condition monitoring and predictive maintenance."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.3",
    "kaggle>=1.7.4",
    "marimo>=0.24.2",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
]

[project.scripts]
bearing-download = "bearing_predictive_maintenance.data:main"
bearing-indicators = "bearing_predictive_maintenance.indicators:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bearing_predictive_maintenance"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=bearing_predictive_maintenance --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# marimo notebooks display a cell's output via a bare trailing expression (e.g. a DataFrame or
# a matplotlib Figure as the last statement) — this is idiomatic marimo, not a bug, so B018
# ("useless expression") is unavoidable here.
"notebooks/*.py" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# No type stubs are published for pandas/scipy in this project's dependency set,
# and adding pandas-stubs/scipy-stubs is out of scope (no new dependencies).
module = ["pandas.*", "scipy.*"]
ignore_missing_imports = true
