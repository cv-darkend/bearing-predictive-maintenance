[project]
name = "bearing-predictive-maintenance"
version = "0.1.0"
description = "Reproducible research scaffold for bearing condition monitoring and predictive maintenance."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.3",
    "kaggle>=1.7.4",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
]

[project.scripts]
bearing-download = "bearing_predictive_maintenance.data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bearing_predictive_maintenance"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=bearing_predictive_maintenance --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
